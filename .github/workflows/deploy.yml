name: Deploy Fumadocs to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Generate static params
        run: node scripts/generate-params.mjs

      - name: Build static site
        run: npm run build
        env:
          NEXT_STATIC_EXPORT: 1

      # Re-running a failed job re-uploads the artifact without cleaning the
      # previous one, leaving two "github-pages" artifacts in the same run,
      # which makes deploy-pages fail ("Multiple artifacts named github-pages").
      # Delete any stale one first so reruns stay single-artifact.
      - name: Delete stale github-pages artifact
        uses: actions/delete-artifact@v4
        with:
          name: github-pages
          failOnError: false

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4